name: i11100-read-wa
on:
  workflow_dispatch:
permissions: write-all
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: env check
        run: |
          for v in ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL; do eval "val=\$$v"; echo "$v len=${#val}"; done
      - name: restore cache written by ANOTHER RUN on same branch (write-all token)
        uses: actions/cache/restore@v4
        with:
          key: i11100-poison
          path: cachepayload
      - name: inspect
        run: |
          echo "SAME_BRANCH_CROSSRUN_WA:"; cat cachepayload/marker.txt 2>/dev/null || echo "NOT_RESTORED"
      - name: attempt cache poison with a new key (write-all token)
        run: |
          mkdir -p poison2 && echo "WA_POISON $(date -u)" > poison2/p.txt
        continue-on-error: true
      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          key: i11100-poison-wa
          path: poison2
      - name: download artifact from another run (needs API+PAT; expect NOT_AVAILABLE)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: i11100-art
          path: dl
      - name: inspect artifact
        run: |
          echo "CROSSRUN_ARTIFACT_WA:"; cat dl/marker.txt 2>/dev/null || echo "NOT_AVAILABLE"
