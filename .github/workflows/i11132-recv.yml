name: i11132-recv
on:
  deployment_status:
permissions: write-all
jobs:
  recv:
    runs-on: ubuntu-latest
    steps:
      - name: perms
        run: |
          echo "EVENT=${{ github.event_name }} REF=${{ github.ref }} SHA=${{ github.sha }}"
          echo "--- token permission (repo) ---"
          curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }} | head -c 1200
          echo
          echo "--- rates/permission header ---"
          curl -s -D - -o /dev/null -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/${{ github.repository }}/actions/permissions
