name: i11132-recv
on:
  deployment_status:
permissions: write-all
jobs:
  recv:
    runs-on: ubuntu-latest
    steps:
      - name: dump
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec 2>&1
          OUT=/tmp/out.txt
          : > $OUT
          echo "EVENT=${{ github.event_name }}" >> $OUT
          echo "REF=${{ github.ref }}" >> $OUT
          echo "SHA=${{ github.sha }}" >> $OUT
          echo "ACTOR=${{ github.actor }}" >> $OUT
          echo "TRIG=${{ github.triggering_actor }}" >> $OUT
          echo "TOKEN_LEN=${#GH}" >> $OUT
          echo "=== whoami ===" >> $OUT
          curl -s -D - -o /tmp/body.txt -H "Authorization: token $GH" https://api.github.com/user | head -5 >> $OUT
          head -c 300 /tmp/body.txt >> $OUT
          echo >> $OUT
          echo "=== repo permissions ===" >> $OUT
          curl -s -H "Authorization: token $GH" https://api.github.com/repos/StephenClash/helloworld >> /tmp/repo.txt
          python3 -c "import json;d=json.load(open('/tmp/repo.txt'));print('permissions=',d.get('permissions'))" >> $OUT 2>&1 || cat /tmp/repo.txt >> $OUT
          echo "=== POST /git/refs (write test) ===" >> $OUT
          curl -s -o /tmp/r1.txt -w "code=%{http_code}" -X POST -H "Authorization: token $GH" -d "{\"ref\":\"refs/heads/i11132-recvtest\",\"sha\":\"${{ github.sha }}\"}" https://api.github.com/repos/StephenClash/helloworld/git/refs >> $OUT
          echo >> $OUT; head -c 200 /tmp/r1.txt >> $OUT; echo >> $OUT
          echo "=== actions/permissions ===" >> $OUT
          curl -s -o /tmp/r2.txt -w "code=%{http_code}" -H "Authorization: token $GH" https://api.github.com/repos/StephenClash/helloworld/actions/permissions >> $OUT
          echo >> $OUT; cat /tmp/r2.txt >> $OUT; echo >> $OUT
          echo "=== DEMO_CANARY set? ${DEMO_CANARY:+YES} / value_len=${#DEMO_CANARY} ===" >> $OUT
          echo "=== git push out ===" >> $OUT
          git config user.email "i11132@local"
          git config user.name "i11132"
          cp $OUT ./i11132-out.txt
          git add -f ./i11132-out.txt
          git commit -m "i11132 out"
          git push "https://x-access-token:$GH@github.com/StephenClash/helloworld" HEAD:exp-11132 >> $OUT 2>&1 && echo "PUSH_OK" >> $OUT || echo "PUSH_FAIL" >> $OUT
