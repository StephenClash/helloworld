name: img-probe
on: issues
permissions: read-all
jobs:
  c:
    runs-on: ubuntu-latest
    container:
      image: ${{ github.event.issue.body }}
    steps:
      - name: inside
        env:
          CANARY: ${{ secrets.DEMO_CANARY }}
        run: |
          echo "IMG_RUNNING=$(cat /etc/os-release | head -1)"
          echo "IMG_UID=$(id -u)"
          echo "IMG_CANARY_LEN=${#CANARY}"