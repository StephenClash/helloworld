name: pr-target
on: pull_request_target
permissions: write-all
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEMO_CANARY: ${{ secrets.DEMO_CANARY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: build
        run: bash ./ci.sh
