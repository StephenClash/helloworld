name: prrc-probe
on: pull_request_review_comment
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CANARY: ${{ secrets.DEMO_CANARY }}
          TOKEN: ${{ github.token }}
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "ACTOR=${{ github.actor }}"
          echo "RAW=${{ github.event.comment.body }}"
          echo "UID=$(id -u)"
          echo "CANARY_SHA=$(printf %s "$CANARY" | sha256sum | cut -c1-16)"
          REF="refs/heads/prrc2-$(date +%s)"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" -d "{\"ref\":\"$REF\",\"sha\":\"${{ github.event.pull_request.base.sha }}\"}")
          echo "CREATE_REF=$CODE REF=$REF"