name: prrc-probe
on: pull_request_review_comment
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          CANARY: ${{ secrets.DEMO_CANARY }}
          TOK: ${{ github.token }}
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "RAW=${{ github.event.comment.body }}"
          echo "TOK_LEN=${#TOK}"
          WHO=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $TOK" "$GITHUB_API_URL/user")
          echo "WHOAMI_CODE=$WHO"
          REF="refs/heads/prrc3-$(date +%s)"
          CODE=$(curl -s -o /tmp/ref.out -w "%{http_code}" -X POST -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/refs" -d "{\"ref\":\"$REF\",\"sha\":\"${{ github.event.pull_request.base.sha }}\"}")
          echo "CREATE_REF=$CODE"
          head -c 200 /tmp/ref.out